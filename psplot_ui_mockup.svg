<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Window -->
  <rect x="10" y="10" width="780" height="500" rx="8" fill="#1E1E1E" stroke="#333" stroke-width="2"/>
  
  <!-- Title Bar -->
  <path d="M10 18C10 13.5817 13.5817 10 18 10H782C786.418 10 790 13.5817 790 18V40H10V18Z" fill="#333333"/>
  <circle cx="25" cy="25" r="5" fill="#FF5F56"/>
  <circle cx="40" cy="25" r="5" fill="#FFBD2E"/>
  <circle cx="55" cy="25" r="5" fill="#27C93F"/>
  <text x="400" y="28" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">PSPlot - Professional Signal Visualization</text>
  
  <!-- Menu Bar -->
  <rect x="10" y="40" width="780" height="25" fill="#252525"/>
  <text x="25" y="57" font-family="Arial" font-size="11" fill="#EEE">File   View   Settings   Help</text>
  
  <!-- Signal Explorer (Sidebar) -->
  <rect x="10" y="65" width="180" height="415" fill="#252525" stroke="#333" stroke-width="1"/>
  <text x="20" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#00AAFF">Signal Explorer</text>
  <rect x="20" y="95" width="160" height="20" rx="4" fill="#333"/>
  <text x="25" y="109" font-family="Arial" font-size="10" fill="#888">Search signals...</text>
  
  <!-- Signal Tree -->
  <text x="25" y="135" font-family="Arial" font-size="11" fill="#DDD">▼ Analog</text>
  <text x="40" y="155" font-family="Arial" font-size="11" fill="#BBB">  IA_1 (A)</text>
  <rect x="15" y="143" width="170" height="18" fill="#004488" opacity="0.3"/>
  <text x="40" y="175" font-family="Arial" font-size="11" fill="#BBB">  IB_1 (A)</text>
  <text x="40" y="195" font-family="Arial" font-size="11" fill="#BBB">  IC_1 (A)</text>
  <text x="25" y="220" font-family="Arial" font-size="11" fill="#DDD">▶ Digital</text>
  
  <!-- Main Plot Area -->
  <rect x="190" y="65" width="600" height="415" fill="#181818"/>
  
  <!-- Subplot 1 -->
  <rect x="210" y="85" width="560" height="160" fill="#000" stroke="#333"/>
  <path d="M210 165 Q 280 65 350 165 T 490 165 T 630 165 T 770 165" stroke="#00FF00" fill="none" stroke-width="1.5"/>
  <text x="215" y="100" font-family="Arial" font-size="10" fill="#00FF00">IA_1 [A]</text>
  <line x1="210" y1="165" x2="770" y2="165" stroke="#333" stroke-dasharray="2,2"/>
  
  <!-- Subplot 2 -->
  <rect x="210" y="265" width="560" height="160" fill="#000" stroke="#333"/>
  <path d="M210 345 Q 280 245 350 345 T 490 345 T 630 345 T 770 345" stroke="#FFCC00" fill="none" stroke-width="1.5"/>
  <text x="215" y="280" font-family="Arial" font-size="10" fill="#FFCC00">VA_1 [V]</text>
  
  <!-- Cursors (Measurement Mode Active) -->
  <line x1="350" y1="85" x2="350" y2="425" stroke="#FF00FF" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="490" y1="85" x2="490" y2="425" stroke="#00FFFF" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="340" y="430" width="160" height="20" rx="4" fill="#FF00FF" opacity="0.2"/>
  <text x="420" y="444" font-family="Arial" font-size="10" fill="#FF00FF" text-anchor="middle">Δt: 20.00 ms (50.0 Hz)</text>
  
  <!-- Status Bar -->
  <rect x="10" y="480" width="780" height="30" fill="#0D47A1"/>
  <text x="20" y="500" font-family="Courier New" font-size="10" fill="#FFF">1-6: #Plots | C:Import Data | N:New page | E:Export | A/D:Pan | R/Y:Reset view | X:Horizontal limits | T:Cursor | M:Margins | P: Page size | Page 1/1</text>
</svg>
